version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15   # PostgreSQL 15 with pgvector extension pre-installed
    container_name: biometa_postgres
    environment:
      POSTGRES_USER: biometa
      POSTGRES_PASSWORD: biometa_secret
      POSTGRES_DB: biometa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometa -d biometa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biometa_backend
    environment:
      DATABASE_URL: postgresql://biometa:biometa_secret@postgres:5432/biometa_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENTREZ_EMAIL: ${ENTREZ_EMAIL:-researcher@example.com}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biometa_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
